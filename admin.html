<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#ff4d8d">
<title>VibeLink Admin</title>
<style>
:root{--p:#ff4d8d;--v:#a78bfa;--t:#2b1a33}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,Segoe UI,Roboto,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;color:var(--t);background:linear-gradient(135deg,#ffe3ef,#ece4ff 55%,#dff1ff);background-attachment:fixed}
body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(60px);z-index:0;pointer-events:none}
body::before{width:260px;height:260px;background:#ff4d8d77;top:-80px;left:-80px}
body::after{width:300px;height:300px;background:#a78bfa77;bottom:-100px;right:-100px}
.wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom))}
.hidden{display:none!important}
h1,h2,h3{margin:0}h3{margin:18px 0 8px}
.sub{font-size:13px;color:#6b5b75;margin:4px 0 0}
.gl{background:rgba(255,255,255,.42);-webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%);border:1px solid rgba(255,255,255,.75);border-radius:20px;box-shadow:0 8px 32px rgba(167,139,250,.25),inset 0 1px 0 rgba(255,255,255,.85);padding:14px}
button{font:inherit;border:0;border-radius:12px;padding:10px 16px;min-height:44px;color:#fff;font-weight:600;background:linear-gradient(90deg,var(--p),var(--v));cursor:pointer}
button.s{background:rgba(255,255,255,.6);color:#c2185b;border:1px solid #ffc2da}
button.d{background:linear-gradient(90deg,#ef4444,#f43f5e)}
button:disabled{opacity:.6;cursor:default}
input{font:inherit;width:100%;min-height:46px;padding:10px 14px;border-radius:12px;border:1px solid #ffc2da;background:rgba(255,255,255,.65);color:var(--t)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:10px 0}
.msg{padding:12px;border-radius:12px;background:rgba(255,255,255,.6);font-size:14px}
.err{color:#c0262d;font-size:13px;margin:8px 0 0}
#login{min-height:90vh;display:flex;align-items:center;justify-content:center}
#login .gl{width:100%;max-width:380px;display:grid;gap:10px;padding:22px}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:11.5px;font-weight:700;vertical-align:middle}.pill.ok{background:#d9f7e6;color:#127a43}.pill.no{background:#ffe0e0;color:#c0262d}
.gk{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:12px 0}
.meta{font-size:12px;color:#6b5b75;margin-top:3px}
.gstats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}.gstats b{display:block;font-size:24px}.gstats span{font-size:12px;color:#6b5b75}
.ch{display:flex;align-items:flex-end;gap:3px;height:140px}
.col{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;font-size:9px;color:#6b5b75}
.col i{display:block;width:100%;min-height:2px;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,var(--p),var(--v))}
.ua{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--p),var(--v));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
.ldr{display:flex;flex-direction:column;align-items:center;gap:14px;padding:40px 16px}
.ring{position:relative;width:78px;height:78px;display:flex;align-items:center;justify-content:center;font-size:30px}
.ring::before{content:"";position:absolute;inset:0;border-radius:50%;border:4px solid #ffd3e4;border-top-color:var(--p);border-right-color:var(--v);animation:rot .9s linear infinite}
.bar2{width:150px;height:6px;border-radius:99px;background:#ffe0ec;overflow:hidden}.bar2 i{display:block;height:100%;width:45%;border-radius:99px;background:linear-gradient(90deg,var(--p),var(--v));animation:slide 1.2s ease-in-out infinite}
.ldr small{font-weight:600;color:#c2527f;font-size:13px}
.mini{display:inline-block;width:14px;height:14px;border:2px solid #ffffff88;border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite;vertical-align:-2px}
@keyframes rot{to{transform:rotate(360deg)}}@keyframes slide{0%{margin-left:-45%}100%{margin-left:100%}}
@media(prefers-reduced-motion:reduce){.ring::before,.bar2 i,.mini{animation:none}}
</style></head>
<body><div class="wrap">
<div id="boot" class="ldr" role="status"><div class="ring">💖</div><div class="bar2"><i></i></div><small>Loading…</small></div>

<div id="login" class="hidden"><div class="gl">
 <h2>🛡️ VibeLink Admin</h2><p class="sub" style="margin:0">Admins only. Sign in with your admin account.</p>
 <input id="un" placeholder="Username" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false">
 <input id="pw" type="password" placeholder="Password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false">
 <div id="lerr" class="err hidden"></div>
 <button id="go">Login</button>
</div></div>

<div id="panel" class="hidden"></div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import {getDatabase,ref,get,set,query,orderByChild,limitToLast} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyCvm6nT3ntdlc5wydXeaZmH0Cmy5M-h3dw",authDomain:"vibe-link-37ee6.firebaseapp.com",databaseURL:"https://vibe-link-37ee6-default-rtdb.firebaseio.com",projectId:"vibe-link-37ee6",storageBucket:"vibe-link-37ee6.firebasestorage.app",messagingSenderId:"879830016817",appId:"1:879830016817:web:d5d2933baf56dca7018610"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app);
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pc=p=>{p=+p;return p>=90&&p<=99?p:90+(((p%10)+10)%10)};
const loader=t=>`<div class="ldr" role="status"><div class="ring">💖</div><div class="bar2"><i></i></div><small>${esc(t)}</small></div>`;
const show=w=>{for(const id of ["boot","login","panel"])$(id).classList.toggle("hidden",id!==w)};
let AD=null,adQ="",admin=null,gone=false;

/* ---------- login ---------- */
const lerr=m=>{$("lerr").textContent=m;$("lerr").classList.remove("hidden")};
$("pw").addEventListener("keydown",e=>{if(e.key==="Enter")$("go").click()});
$("go").onclick=async()=>{
 const u=$("un").value.trim().toLowerCase(),p=$("pw").value;
 if(!/^[a-z0-9_]{3,20}$/.test(u)||!p)return lerr("Enter your username and password.");
 $("lerr").classList.add("hidden");const t0=$("go").textContent;$("go").disabled=true;$("go").innerHTML='<span class="mini"></span> Please wait…';
 try{await signInWithEmailAndPassword(auth,u+"@vibelink.app",p)}
 catch(e){lerr(e.code==="auth/invalid-credential"?"Wrong username or password.":"Could not sign in. Try again.")}
 $("go").disabled=false;$("go").textContent=t0};

/* ---------- auth gate: only accounts listed under /admins can open the panel ---------- */
onAuthStateChanged(auth,async u=>{
 if(!u){admin=null;AD=null;show("login");return}
 show("boot");
 let ok=false;try{await get(ref(db,"users"));ok=true}catch(e){}
 if(!ok){lerr("This account is not an admin.");await signOut(auth);return}
 admin=u.email.split("@")[0];await open_()});

/* ---------- data ---------- */
async function adminLoad(){
 const [u,l,h,d,g]=await Promise.all([get(ref(db,"users")),get(ref(db,"links")),get(query(ref(db,"hstats"),orderByChild("t"),limitToLast(5000))),get(ref(db,"disabled")),get(ref(db,"settings/off"))]);
 const acc={};
 u.forEach(c=>{const v=c.val();if(v&&v.u)acc[v.u]={name:v.u,c:+v.c||0}});
 l.forEach(c=>{const v=c.val(),a=acc[c.key]||(acc[c.key]={name:c.key,c:0});a.link=true;a.pct=v.pct;if(!a.c)a.c=+v.t||0});
 const st=[],cnt={},off={};
 h.forEach(c=>{const v=c.val();st.push(+v.t||0);cnt[v.l]=(cnt[v.l]||0)+1});
 d.forEach(c=>{off[c.key]=true});
 AD={list:Object.values(acc).map(a=>({...a,n:cnt[a.name]||0,off:!!off[a.name]})).sort((a,b)=>b.c-a.c),st,off:g.val()===true}}
const dayBars=(ms,n=14)=>{const d0=new Date();d0.setHours(0,0,0,0);const o=[];for(let i=n-1;i>=0;i--){const a=new Date(d0);a.setDate(a.getDate()-i);const s=a.getTime(),e=new Date(a).setDate(a.getDate()+1);o.push({d:a.getDate()+"/"+(a.getMonth()+1),n:ms.filter(x=>x>=s&&x<e).length})}return o};
const chartH=a=>{const m=Math.max(1,...a.map(x=>x.n));return`<div class="ch">${a.map(x=>`<div class="col" title="${esc(x.d)}: ${x.n}"><span>${x.n}</span><i style="height:${x.n/m*70}%"></i><span>${esc(x.d)}</span></div>`).join("")}</div>`};

async function open_(){
 show("panel");$("panel").innerHTML=loader("Loading admin data…");
 try{await adminLoad();render()}
 catch(e){$("panel").innerHTML=`<div class="gl"><p>Could not load admin data. Publish the latest database rules and make sure your account is listed under <b>admins</b>.</p><p class="sub">${esc(e.message)}</p><div class="bar"><button id="rt">Retry</button><button class="s" id="lo">Logout</button></div></div>`;
  $("rt").onclick=open_;$("lo").onclick=()=>signOut(auth)}}

/* ---------- panel ---------- */
function render(){
 const L=AD.list,d0=new Date();d0.setHours(0,0,0,0);const t0=d0.getTime();
 const stat=(n,l)=>`<div class="gl"><b>${n}</b><span>${l}</span></div>`;
 $("panel").innerHTML=`
 <div class="bar"><div><h2>🛡️ Admin Panel</h2><p class="sub">@${esc(admin)} · usernames and counts only, crush names are never shown here.</p></div>
  <div style="display:flex;gap:8px"><button class="s" id="adr">🔄 Refresh</button><button class="s" id="lo">Logout</button></div></div>
 <div class="gl gk"><div><b>${AD.off?"All links are paused":"All links are live"}</b> <span class="pill ${AD.off?"no":"ok"}">${AD.off?"PAUSED":"LIVE"}</span><div class="meta">Master switch for every link on the site.</div></div><button id="gk" class="${AD.off?"":"d"}">${AD.off?"Resume all links":"Pause all links"}</button></div>
 <div class="gstats">${stat(L.length,"Total accounts")}${stat(L.filter(a=>a.c>=t0).length,"New today")}${stat(L.filter(a=>a.link&&!a.off).length,"Active links")}${stat(L.filter(a=>a.off).length,"Paused links")}${stat(AD.st.length,"Reveals tracked")}${stat(AD.st.filter(x=>x>=t0).length,"Reveals today")}</div>
 <h3>New accounts per day</h3><div class="gl">${chartH(dayBars(L.map(a=>a.c)))}</div>
 <h3>Reveals per day</h3><div class="gl">${chartH(dayBars(AD.st))}</div>
 <h3>Accounts</h3><div class="bar"><input id="aq" placeholder="Search username…" value="${esc(adQ)}"></div><div id="al"></div>`;
 const draw=()=>{adQ=$("aq").value;const q=adQ.trim().toLowerCase(),F=L.filter(a=>a.name.includes(q));
  $("al").innerHTML=(F.length?F.slice(0,100).map(a=>`<div class="gl ua"><div class="av">${esc(a.name[0].toUpperCase())}</div><div style="flex:1;min-width:0"><b style="overflow-wrap:anywhere">@${esc(a.name)}</b> <span class="pill ${a.off?"no":"ok"}">${a.off?"Paused":"Active"}</span><div class="meta">Joined ${a.c?new Date(a.c).toLocaleDateString():"-"} · ${a.link?a.n+" reveals · score "+pc(a.pct)+"%":"no link yet"}</div></div><button data-p="${esc(a.name)}" class="${a.off?"":"d"}">${a.off?"Resume":"Pause"}</button></div>`).join(""):'<div class="gl">No accounts found.</div>')+(F.length>100?`<p class="sub">Showing 100 of ${F.length}. Search to narrow down.</p>`:"")};
 draw();$("aq").oninput=draw;
 $("lo").onclick=()=>signOut(auth);
 $("adr").onclick=()=>{AD=null;open_()};
 $("gk").onclick=async()=>{if(!AD.off&&!confirm("Pause ALL links? Nobody can use any link until you resume."))return;$("gk").disabled=true;
  try{await set(ref(db,"settings/off"),!AD.off);AD.off=!AD.off}catch(e){alert("Could not change this. Check the database rules.")}render()};
 $("al").onclick=async e=>{const b=e.target.closest("[data-p]");if(!b)return;const a=L.find(x=>x.name===b.dataset.p);if(!a)return;
  if(!a.off&&!confirm("Pause @"+a.name+"'s link?"))return;b.disabled=true;b.innerHTML='<span class="mini"></span>';
  try{await set(ref(db,"disabled/"+a.name),a.off?null:true);a.off=!a.off}catch(x){alert("Could not change this. Check the database rules.")}render()}}
</script></body></html>
